<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.0">
    <title>🎯 Marble Race Live</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e94560">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Marble Race">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="icon" type="image/png" href="assets/icon-192.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="design-system.css">
    <script>
        // Apply theme SEBELUM script lain load
        (function applyThemeEarly() {
            try {
                var saved = localStorage.getItem("marble-theme");
                if (saved) document.documentElement.setAttribute("data-theme", saved);
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div id="menuScreen" class="hidden">
        <div class="menu-content">
            <h1 class="menu-title">MARBLE RACE</h1>
            <div class="menu-sub">ULTIMATE EDITION</div>
            <div class="menu-tagline">Ketik <b>!join [nama]</b> di YouTube untuk ikut balapan</div>
            <button id="playBtn" class="menu-btn menu-btn-primary">▶ MULAI</button>
            <div class="menu-btn-row">
                <button id="settingsBtn" class="menu-btn menu-btn-secondary">⚙️ Setting</button>
                <button id="aboutBtn" class="menu-btn menu-btn-secondary">ℹ️ Tentang</button>
            </div>
            <div class="menu-footer">v1.0 — Live Streaming Ready</div>
        </div>
    </div>


<div id="splashScreen">
        <div id="splashLogo">🎯</div>
        <div id="splashTitle">MARBLE RACE</div>
        <div id="splashSubtitle">ULTIMATE EDITION</div>
        <div id="splashLoader"><div id="splashBar"></div></div>
        <div id="splashFooter">Live Streaming Ready</div>
    </div>


    <canvas id="raceCanvas"></canvas>
    <div id="hud">
        <div id="fb-status" title="Firebase status">⏳</div>
        <div id="timer">00:00.00</div>
        <div id="countdown"></div>
    </div>
    <div id="notifContainer"></div>
    <div id="pesertaPanel">
        <div id="panelTitle">👥 Peserta (<span id="pesertaCount">0</span>)</div>
        <div id="inputRow">
            <input id="namaInput" type="text" placeholder="Ketik nama..." maxlength="12" autocomplete="off">
            <button id="tambahBtn">+</button>
        </div>
        <div id="pesertaList">
            <div class="peserta-empty">Belum ada peserta</div>
        </div>
        <div id="trackRow"><label for="trackSelect">🛤️ Track:</label><select id="trackSelect"><option value="zigzag">Zig-Zag</option><option value="plinko">Plinko</option><option value="spinners">Spinners</option></select></div>
        <div id="themeRow"><label for="themeSelect">🎨 Tema:</label><select id="themeSelect"><option value="purple">Ungu</option><option value="blue">Biru</option><option value="green">Hijau</option><option value="pink">Pink</option></select></div>
        <div id="panelActions">
            <button id="resetPesertaBtn">🗑️ Reset</button>
        </div>
    </div>
    <div id="ui">
        <button id="startBtn">🎯 MULAI RACE</button>
    </div>
    <script src="js/matter.min.js"></script>

    <!-- Firebase SDK (compat mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <!-- Firebase config + helper -->
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase.js"></script>

    <!-- Game -->
    <script src="js/game.js"></script>

    <script>
        // Register Service Worker (PWA)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then((reg) => console.log('✅ SW registered:', reg.scope))
                    .catch((err) => console.warn('⚠️ SW failed:', err));
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎯 Marble Race Live</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="raceCanvas"></canvas>
    <div id="hud">
        <div id="fb-status" title="Firebase status">⏳</div>
        <div id="timer">00:00.00</div>
        <div id="countdown"></div>
    </div>
    <div id="notifContainer"></div>
    <div id="pesertaPanel">
        <div id="panelTitle">👥 Peserta (<span id="pesertaCount">0</span>)</div>
        <div id="inputRow">
            <input id="namaInput" type="text" placeholder="Ketik nama..." maxlength="12" autocomplete="off">
            <button id="tambahBtn">+</button>
        </div>
        <div id="pesertaList">
            <div class="peserta-empty">Belum ada peserta</div>
        </div>
        <div id="panelActions">
            <button id="resetPesertaBtn">🗑️ Reset</button>
        </div>
    </div>
    <div id="ui">
        <button id="startBtn">🎯 MULAI RACE</button>
    </div>
    <script src="js/matter.min.js"></script>

    <!-- Firebase SDK (compat mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <!-- Firebase config + helper -->
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase.js"></script>

    <!-- Game -->
    <script src="js/game.js"></script>
</body>
</html>
